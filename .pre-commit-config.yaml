# Quality gates on every commit:  pip install pre-commit  &&  pre-commit install
# Run everything by hand at any time with:  pre-commit run --all-files

exclude: ^(archive|dataset|dataset_archive_endless_runner|dataset_external|game_archive_endless_runner|venv)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=12000"]   # the 9 MB frozen checkpoint is the largest allowed file

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy game src tests
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest (fast)
        entry: python -m pytest -q -m "not slow"
        language: system
        pass_filenames: false
        stages: [pre-push]
